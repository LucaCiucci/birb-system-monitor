[package]
name = "birb-system-monitor-gui"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "birb-monitor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
ecow = { version = "0.2.7", features = ["serde"] }
eframe = { version = "0.34.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    #"ron",
    #"serde",
    #"wayland",
    #"web_screen_reader",
    #"wgpu",
    #"wgpu_no_default_features",
    #"x11",

    "persistence",
    "glow",
] }
egui = "0.34.2"
egui_dock = { version = "0.19.1", features = ["serde"] }
egui_extras = "0.34.2"
egui_plot = "=0.35.0"
human-units = "0.5.3"
ordered_hash_map = { version = "0.6.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.38.4"
ustr = "1.1.0"
uuid = { version = "1.23.1", features = ["v4"] }
